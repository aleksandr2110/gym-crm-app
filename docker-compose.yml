services:
  mysql:
    image: mysql:8.0.32
    container_name: gym-crm-app-mysql
    mem_limit: 512m
    ports:
      - "3307:3307"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpwd
      - MYSQL_DATABASE=rest
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password_secret
      - MYSQL_TCP_PORT=3307
    healthcheck:
      test: "/usr/bin/mysql --user=user --password=password_secret --execute \"SHOW DATABASES;\""
      interval: 5s
      timeout: 2s
      retries: 60
    networks:
      - microservice-network

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      # AMQP protocol port for application connections
      - "5672:5672"
      # HTTP API and Management UI port
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 15s
      retries: 3
    networks:
      - microservice-network

  gym-app:
    build: core-gym-app
    container_name: core-gym-app
    ports:
      - "8081:8081"
    restart: always
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
      - DATABASE_PORT=3307
#      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - prometheus
      - rabbitmq
    networks:
      - microservice-network
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./core-gym-app/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - monitoring

  track-gym-app:
    container_name: work-load-service
    build: track-gym-app
    ports:
      - "8083:8083"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
#      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - rabbitmq
    networks:
      - microservice-network


networks:
  monitoring:
    driver: bridge
  microservice-network:
    driver: bridge

volumes:
  rabbitmq_data:
  prometheus-data: