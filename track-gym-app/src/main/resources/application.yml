management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
    prometheus:
      access: read_only
    metrics:
      access: read_only
  metrics:
    tags:
      application: workload-service
  prometheus:
    metrics:
      export:
        enabled: true

