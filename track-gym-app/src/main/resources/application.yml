springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: epam.controller
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
    prometheus:
      access: read_only
    metrics:
      access: read_only
  metrics:
    tags:
      application: workload-service
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    epam.workload: DEBUG
  file:
    name: logs/workload-service.log


spring.config.activate.on-profile: docker