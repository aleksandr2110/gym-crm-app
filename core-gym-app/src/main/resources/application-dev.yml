server:
  port: 8081
#  mysql:3307 is a service in docker-compose
spring:
  application:
    name: core-gym-app
  datasource:
    username: user
    password: password_secret
    url: jdbc:mysql://mysql:3307/rest?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  liquibase:
    enabled: true
    change-log: classpath:data/db-changelog-master.xml

  cloud:
    openfeign:
      circuitbreaker:
        enabled: false
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 5000
            logger-level: basic

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 8640000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30

  jackson:
    deserialization:
      fail-on-unknown-properties: false
      accept-single-value-as-array: true

management:
  endpoints:
    web:
      exposure:
        include: 'health, info, prometheus'
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

#  http://localhost:8080/swagger-ui.html
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: epam.controller
  default-consumes-media-type: application/json
  default-produces-media-type: application/json


---
spring.config.activate.on-profile: docker

server.port: 8081

spring.datasource:
  url: jdbc:mysql://mysql/rest